# Conda environment for the whole practical. Create: conda env create -f environment.yml
# Update after a change:            conda env update -f environment.yml --prune
name: symai
channels:
  - conda-forge
dependencies:
  - python=3.12
  # runtime: imports of the vendored aima-python (src/aima)
  - numpy
  - networkx
  - ipython
  - sortedcontainers
  # report figures (symbolic_ai.viz)
  - matplotlib
  # EJ2 ontology figure: Graphviz's `dot` and its Python binding
  - graphviz
  - python-graphviz
  # Times New Roman for the EJ2 figures (the report's font; the plot tests check that it is embedded)
  - mscorefonts
  # development
  - pytest
  - pytest-cov
  - ruff
  - mypy
  - pip
  - pip:
      - -e .
      # EJ2 oracle: HermiT through owlready2 (needs a Java runtime >= 11 on the system)
      - owlready2==0.51
