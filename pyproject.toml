[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-ai-practicas"
version = "0.1.0"
description = "IA simbólica (MUIA, UAM 2026/27): a safe-prescribing agent (SAT), ontology and search over one shared drug formulary"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rodrigo Laso Mielgo" }, { name = "Mario Pascual González" }]
dependencies = [
    # Imports of the vendored aima-python (src/aima): utils -> numpy, logic -> networkx,
    # agents -> IPython, csp -> sortedcontainers.
    "numpy>=1.26",
    # Report figures (symbolic_ai.viz, p1_ej1_logic.plot).
    "matplotlib>=3.8",
    "networkx>=3.2",
    "ipython>=8.0",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
# EJ2: the HermiT oracle (owlready2 bundles HermiT; needs a Java runtime >= 11) and the ontology
# figure (the Python binding; Graphviz's `dot` executable comes from conda-forge `graphviz`).
owl = ["owlready2==0.51", "graphviz>=0.20"]

[project.scripts]
symai-ej1 = "symbolic_ai.p1_ej1_logic.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["symbolic_ai*", "aima*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: reads the real database under data/",
    "slow: takes more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/aima"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "SIM", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
# The conda env pins Python 3.12, and numpy >= 2.5 ships stubs that only parse as 3.12.
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["symbolic_ai"]
exclude = ["src/aima/"]

[[tool.mypy.overrides]]
module = ["aima", "aima.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Untyped third-party libraries of EJ2 (no stubs in the conda env); wrapped at one place each.
module = ["networkx", "networkx.*", "owlready2", "owlready2.*", "graphviz", "graphviz.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["symbolic_ai"]
omit = ["src/aima/*"]
